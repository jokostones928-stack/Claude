<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Budget Monitor{% endblock %} - FinanceApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-brand">
            <h2>💰 FinanceApp</h2>
            <p>Budget Monitoring System</p>
        </div>
        <ul class="nav-menu">
            <li>
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <span class="icon">📊</span> Dashboard
                </a>
            </li>
            <li>
                <a href="{{ url_for('transactions') }}" class="{% if request.endpoint == 'transactions' %}active{% endif %}">
                    <span class="icon">💳</span> Transaksi
                </a>
            </li>
            <li>
                <a href="{{ url_for('budgets') }}" class="{% if request.endpoint == 'budgets' %}active{% endif %}">
                    <span class="icon">🎯</span> Kelola Budget
                </a>
            </li>
        </ul>
    </nav>

    <div class="main">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
